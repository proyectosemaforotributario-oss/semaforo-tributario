<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semáforo Tributario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #EDF0EE; --hoja: #FFFFFF; --tinta: #16202A; --tinta-2: #56626C; --linea: #D2D8D5;
    --sello: #2A3E9E; --rojo-texto: #B02A22;
    --carcasa: #1E252C; --rojo: #D1342B; --ambar: #EAA000; --verde: #1D8C50;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --papel: #12171C; --hoja: #1A2128; --tinta: #E9EEF1; --tinta-2: #9AA6AF; --linea: #2E3841; --sello: #93A5FF; --rojo-texto: #FF8A80; --carcasa: #0B0F13; color-scheme: dark; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; font-size: 1.0625rem; line-height: 1.55; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 40px; }
  .marca-luz { display: inline-flex; flex-direction: column; gap: 2px; background: var(--carcasa); padding: 3px; border-radius: 6px; }
  .marca-luz i { width: 6px; height: 6px; border-radius: 50%; }
  .marca-luz i:nth-child(1) { background: var(--rojo); } .marca-luz i:nth-child(2) { background: var(--ambar); } .marca-luz i:nth-child(3) { background: var(--verde); }
  h1 { font-size: 2rem; line-height: 1.1; margin: 0 0 12px; }
  p { margin: 0 0 20px; }
  .btn { height: 54px; padding: 0 22px; border: 0; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 700; background: var(--tinta); color: var(--papel); }
  .btn:disabled { opacity: .6; cursor: default; }
  a { color: var(--sello); }
  :focus-visible { outline: 3px solid var(--sello); outline-offset: 2px; }
  .error { color: var(--rojo-texto); font-weight: 700; }
  .sello {
    display: inline-block; transform: rotate(-6deg); margin: 4px 0 24px; padding: 6px 16px 5px;
    color: var(--sello); border: 3px solid var(--sello); border-radius: 6px; outline: 1.5px solid var(--sello); outline-offset: 2px;
    font-weight: 700; font-size: 1.4rem; letter-spacing: .14em; animation: estampar .32s cubic-bezier(.2, .8, .3, 1.2);
  }
  @keyframes estampar { from { transform: rotate(-6deg) scale(1.7); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sello { animation: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="marca"><span class="marca-luz" aria-hidden="true"><i></i><i></i><i></i></span>Semáforo Tributario</div>
  <div aria-live="polite">
    <span class="sello" id="sello" hidden>PRESENTADA</span>
    <h1 id="titulo"></h1>
    <p id="texto"></p>
  </div>
  <button class="btn" id="boton" hidden></button>
  <p class="error" id="error" role="alert" hidden></p>
  <p id="enlaces"></p>
</main>
<script>
const DATOS = <?!= datosJson ?>;
const $ = id => document.getElementById(id);

function mostrar(d) {
  $('titulo').textContent = d.titulo;
  $('texto').textContent = d.texto || '';
  $('sello').hidden = !d.sello;
  $('enlaces').innerHTML = '';
  if (d.enlace) $('enlaces').append(enlace(d.enlace.texto, d.enlace.url));
  if (d.deshacer) { $('enlaces').append('  |  '); $('enlaces').append(enlace('Deshacer', d.deshacer)); }
}
function enlace(texto, url) {
  const a = document.createElement('a');
  a.textContent = texto; a.href = url; a.target = '_top';
  return a;
}

mostrar(DATOS);
if (DATOS.boton) {
  $('boton').textContent = DATOS.boton;
  $('boton').hidden = false;
  $('boton').addEventListener('click', () => {
    $('boton').disabled = true; $('error').hidden = true;
    google.script.run
      .withSuccessHandler(r => { $('boton').hidden = true; mostrar(r); })
      .withFailureHandler(() => {
        $('boton').disabled = false;
        $('error').textContent = 'No se pudo completar. Revisa tu conexión e inténtalo otra vez.';
        $('error').hidden = false;
      })
      .ejecutarAccion(DATOS.accion, DATOS.t, DATOS.c);
  });
}
</script>
</body>
</html>
